[build-system]
requires = ["hatchling>=1.25.0"]
build-backend = "hatchling.build"

[project]
name = "sacco-ledger"
version = "0.1.0"
description = "Offline-first VSLA & SACCO member share-capital, M-of-N officer quorum loan approval, integer minor-unit amortization, end-of-cycle dividend share-out, and tamper-evident SHA-256 passbook engine."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Akandwanaho Ivan Alvin", email = "codesphereinnovationz@gmail.com" },
]
keywords = [
    "sacco",
    "vsla",
    "microfinance",
    "financial-inclusion",
    "cooperative",
    "ledger",
    "offline-first",
    "sqlite",
    "africa",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
    "mypy>=1.11.0",
]

[project.scripts]
sacco-ledger = "sacco_ledger.cli:main"

[project.urls]
Homepage = "https://github.com/codesphere-u/sacco-ledger"
Repository = "https://github.com/codesphere-u/sacco-ledger"
Issues = "https://github.com/codesphere-u/sacco-ledger/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/sacco_ledger"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
packages = ["sacco_ledger"]
